# ClusterExternalSecret for ClickHouse's RustFS (S3) cold tier.
# Creates an ExternalSecret in any namespace labeled:
#   platform.duynhlab/clickhouse: "true"   (currently: monitoring — the same
#   label clickhouse.yaml already selects on, so no namespace edit)
#
# Reuses the existing RustFS credentials in OpenBAO (same access keys work for
# any bucket; a per-consumer identity is a recorded DR gap, not this change).
# ClickHouse moves parts older than the hot window into the `clickhouse-otel`
# bucket. Key format: ACCESS_KEY_ID, ACCESS_SECRET_KEY — mapped to env on the
# ClickHouse pod and read by the storage XML via from_env, never written into
# the ClickHouseInstallation.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: clickhouse-rustfs
  labels:
    app.kubernetes.io/name: clickhouse-rustfs-credentials
    app.kubernetes.io/component: olap
    app.kubernetes.io/managed-by: external-secrets
spec:
  namespaceSelector:
    matchLabels:
      platform.duynhlab/clickhouse: "true"

  refreshTime: 1h

  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: openbao
      kind: ClusterSecretStore
    target:
      name: clickhouse-rustfs-credentials
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        type: Opaque
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-rustfs-credentials
            app.kubernetes.io/component: olap
            app.kubernetes.io/managed-by: external-secrets
    data:
      - secretKey: ACCESS_KEY_ID
        remoteRef:
          key: secret/data/local/infra/rustfs/backup-cnpg
          property: access_key_id
      - secretKey: ACCESS_SECRET_KEY
        remoteRef:
          key: secret/data/local/infra/rustfs/backup-cnpg
          property: secret_access_key
